name: Python Code Review Agent

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'pyproject.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Run Python Code Review Agent
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Review & Project Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install tiktoken pydantic google-genai httpx ruff pytest pytest-asyncio

      # Phase 1: Local Automated Checks (Linter & Pytest)
      - name: Run Phase 1 Automated Checks
        continue-on-error: true
        run: |
          echo "### Phase 1 Automated Validation Results" > phase1_report.txt
          echo "#### Ruff Linter Output:" >> phase1_report.txt
          ruff check . >> phase1_report.txt 2>&1 || true

          echo "#### Pytest Suite Output:" >> phase1_report.txt
          pytest -v >> phase1_report.txt 2>&1 || true

      # Phase 2: Agent Review (Tiktoken pruning, Structured JSON, GitHub REST API)
      - name: Run Python Reviewer Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.Gemini_key || secrets.GEMINI_KEY }}
          GEMINI_MODEL: "gemini-2.0-flash"
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python .github/scripts/review_agent.py
