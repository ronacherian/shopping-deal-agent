name: Python Code Review Agent

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'pyproject.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Run Python Code Review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest pytest-asyncio google-genai

      # Phase 1: Automated Static Analysis & Tests
      - name: Run Phase 1 Automated Checks
        continue-on-error: true
        run: |
          echo "### Phase 1 Automated Validation Results" > phase1_report.txt
          echo "#### Ruff Linter Output:" >> phase1_report.txt
          ruff check . >> phase1_report.txt 2>&1 || true

          echo "#### Pytest Suite Output:" >> phase1_report.txt
          pytest -v >> phase1_report.txt 2>&1 || true

      # Phase 2: Review Agent execution with Gemini API
      - name: Run Python Reviewer Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.Gemini_key || secrets.GEMINI_KEY }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python .github/scripts/review_agent.py

      # Post or update PR review comment
      - name: Post PR Review Comment
        if: always() && hashFiles('pr_review.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body-file pr_review.md
